<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- OG tags, icons, more meta tags... -->
    <title>Testimonial Cards</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="main">
        <figure class="main__testimonial-card main__testimonial-card--speech">
            <blockquote class="speech-bubble">
                <p>I have been solving all the project ideas on roadmap.sh and I am surprised how far I have come from
                    where
                    I started.<br><br>Highly recommended!</p>
            </blockquote>
            <figcaption class="small-author">
                <img src="https://placehold.co/100" alt="Artem Jones" width="100" height="100">
                <div class="small-author__info">
                    <cite>Artem Jones</cite>
                    <span class="author-role">Junior Frontend Developer</span>
                </div>
            </figcaption>
        </figure>

        <figure class="main__testimonial-card">
            <blockquote>
                <p>Since starting my career in 2021, I have only followed one resource, roadmap.sh, it truly helped me
                    go
                    from 0 to having a job and changing the financial trajectory of my family</p>
            </blockquote>
            <figcaption class="small-author">
                <img src="https://placehold.co/100" alt="Artem Jones" width="100" height="100">
                <div class="small-author__info">
                    <cite>
                        Artem Jones
                    </cite>
                    <span class="author-role">Junior Frontend Developer</span>
                </div>
            </figcaption>
        </figure>

        <img class="highlight-img" src="https://placehold.co/350" alt="Artem Jones" width="350" height="350">
        <figure class="main__testimonial-card highlight-card">
            <div>⭐⭐⭐⭐⭐</div>
            <figcaption class="highlight-author">
                <cite>
                    Jackie Mackle
                </cite>
                <span class="author-role">Engineering Manager</span>
            </figcaption>
            <blockquote>
                <p>I find myself recommending roadmap.sh to all the internees or junior developers. It's a great way to
                    skill up and grow in your career.</p>
            </blockquote>
        </figure>

        <figure class="main__testimonial-card main__testimonial-card--full">
            <blockquote class="carousel-description">
                <p>roadmap.sh is an incredible resource. I was fortunate to discover it during my university days in
                    2018.
                    Back then, it was just a single repository with three images. It's amazing to see how much impact it
                    has
                    had on millions of lives since then.</p>
            </blockquote>
            <figcaption class="carousel-author">
                <img src="https://placehold.co/100" alt="Artem Jones" width="100" height="100">
                <cite>
                    Artem Jones
                </cite>
            </figcaption>
        </figure>
    </main>
</body>

</html>
